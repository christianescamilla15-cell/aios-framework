  # ═══════════════════════════════════════════════════════════════
  # BUSINESS RULES · REQUIEREN REVIEW HUMANO · NO auto_fix
  # ═══════════════════════════════════════════════════════════════
  - id: FLIGHT_829_NOSHOW_RULE
    description: >
      Vuelo 829 en contexto NoShow puede ser BUG (hardcoded) O
      REGLA DE NEGOCIO legítima (ej. acuerdo específico con Sabre
      para ese vuelo). REQUIERE confirmación humana antes de refactor.
    matches:
      # Vuelo 829 en cualquier contexto de Flight/PNR
      - regex: '(?:flight|vuelo|FlightNumber|PNR).*["'']829["'']'
        flags: "i"
      - regex: '["'']829["''].*(?:flight|vuelo|noshow)'
        flags: "i"
    classification: "business_rule"
    auto_fix_allowed: false
    pause_message: >
      Vuelo 829 aparece hardcoded en contexto NoShow. Esto puede
      ser (a) bug de hardcoding · migrar a config/PNR runtime, O
      (b) regla de negocio específica acordada con Sabre/Miguel
      Rachid. CONFIRMAR intent con stakeholder antes de refactor.
    evidence_required:
      - "adr_reference"
      - "stakeholder_sign_off_miguel_rachid"
    tags: ["noshow", "business", "flight", "review-required"]

  # ═══════════════════════════════════════════════════════════════
  # DRIFT · secretos reales en configs de test (RFC-002c placeholder)
  # ═══════════════════════════════════════════════════════════════
  - id: SECRETS_IN_TEST_CONFIG
    description: >
      Credenciales reales encontradas en archivos de test/qa/staging.
      Debe ser mock · no valor real · compromete security + test
      validity.
    matches:
      - regex: '(?:test|qa|staging|fixture).*\.config.*(?:password|secret|apikey)'
        flags: "i"
    classification: "business_rule"
    auto_fix_allowed: false
    pause_message: >
      Secretos reales en config de testing detectados. Confirmar
      con ciber antes de refactor · puede ser simplificación test
      o leak real. Generar mock + rotar credencial si era real.
    evidence_required: ["mock_reference", "credential_rotation_plan"]
    tags: ["test", "drift", "review-required"]

  # ═══════════════════════════════════════════════════════════════
  # CODE SMELLS · TODO/DEAD code de iteraciones previas
  # ═══════════════════════════════════════════════════════════════
  - id: TODO_REMOVE_OLD
    description: >
      Markers TODO-REMOVE / DEPRECATED · pueden ser deuda técnica
      legítima o código olvidado de iteración anterior.
    matches:
      - regex: '(?:TODO|FIXME|XXX|HACK).*(?:remove|delete|deprecated)'
        flags: "i"
      - regex: '@deprecated'
    classification: "unclear"
    auto_fix_allowed: false
    pause_message: >
      Marker de remoción encontrado. Verificar con git blame si es
      deuda reconocida (> 3 meses OK · < 1 mes sospechoso) antes
      de limpiar.
    tags: ["dead-code", "review-required"]


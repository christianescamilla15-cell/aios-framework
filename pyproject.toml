[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aios-kiro"
version = "4.0.0"
description = "AIOS — AI Engineering Operating System. Spec-driven development, embedded security gate and governance-as-code."
dependencies = [
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Christian Hernandez Escamilla", email = "christianescamilla15@gmail.com"},
]
keywords = ["ai", "engineering", "agents", "spec-driven", "kiro", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2,<2"]          # servidor MCP (aios-mcp) · la API FastMCP cambió en mcp 2.x
pdf = ["weasyprint>=60", "markdown>=3.5"]

[project.scripts]
aios = "aios.cli.main:main"
aios-mcp = "aios.mcp_server:main"

[project.urls]
Homepage = "https://github.com/christianescamilla15-cell/aios-framework"
Repository = "https://github.com/christianescamilla15-cell/aios-framework"

[tool.setuptools.packages.find]
include = ["aios*"]

[tool.setuptools.package-data]
# Datos que el código lee en tiempo de ejecución: reglas de gobierno (YAML), plantillas (Jinja2),
# reglas por stack y políticas (Markdown). Sin esto el wheel instalado no encuentra las reglas.
"aios" = ["**/*.md", "**/*.yaml", "**/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["aios"]
branch = true

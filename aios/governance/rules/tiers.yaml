# ---------------------------------------------------------------------------
# 4 TIERs oficiales · 9 criterios por TIER
# ---------------------------------------------------------------------------

tiers:

  T0:
    description_es: "Soporta, alimenta o recibe información de procesos más críticos requeridos para la continuidad de las operaciones."
    description_en: "Supports, feeds, or receives information from the most critical processes required for the continuity of operations."

    # Criterios de selección
    impact:
      revenue: "alto"
      service: "alto"
      operation: "alto"
    pci_pii: true
    vigencia: "permanente"

    # Resiliencia
    continuity_ha: "Activo-Activo (multiregión)"
    redundancia:
      - "Multiregión"
      - "Multizona (hasta dos zonas)"
    disponibilidad: 0.9998
    downtime_per_year:
      minutes: 105.12
      hours: 1.752
      days: 0.073
    incidents_max: 10

    # Backup
    tipo_respaldo: "Continuous backup · Point-In-Time Recovery (PITR)"
    frecuencia_respaldo:
      full: "mínimo cada mes"
      incremental_tx_log: "cada 15 min (RDS · Aurora · DynamoDB)"
    retencion: "Acorde a necesidades de negocio o cumplimiento regulatorio (PCI · SOX · ISO). Retención online y offline."

    # Recuperación
    rto_minutes: 10  # 0 a 10 min
    rpo_minutes: 60  # 60 min

    # AWS account model
    cuenta_aws_compartida: false
    cuenta_aws_compartida_max_apps: 1  # Cada app dedicada · NO comparte

    # Gestión
    tipo_gestion: "Por torre de TI"
    estrategia_migracion: "Refactoring"
    nivel_riesgo_aceptado: "No críticas, no altas. Cumplimiento SLAs."

    # ACME-specific (derivado sesión Fernando)
    multiregion_required: true
    multiregion_pattern: "Activo-Activo Virginia (us-east-1) + Oregon (us-west-2)"
    yubikey_required: true  # Admin role
    cmk_count: 5  # secrets · aurora · s3-cfdis · logs · ebs

  T1:
    description_es: "Soporta, alimenta o recibe información de procesos estratégicos con funciones comerciales requeridas para las operaciones aéreas en curso."
    description_en: "Supports, feeds, or receives information from strategic processes with business functions required for ongoing air operations."

    impact:
      revenue: "medio"
      service: "medio"
      operation: "medio"
    pci_pii: true
    vigencia: "permanente"

    continuity_ha: "Activo-Pasivo (multiregión)"
    redundancia:
      - "Multiregión"
      - "Multizona (hasta dos zonas)"
    disponibilidad: 0.9994
    downtime_per_year:
      minutes: 315.36
      hours: 5.256
      days: 0.219
    incidents_max: 10

    tipo_respaldo: "Continuous backup · Point-In-Time Recovery (PITR)"
    frecuencia_respaldo:
      full: "mínimo cada mes"
      incremental_tx_log: "cada 30 min (RDS · Aurora · DynamoDB)"
    retencion: "Acorde a necesidades de negocio o cumplimiento regulatorio."

    rto_minutes: 30  # hasta 30 min
    rpo_minutes_min: 120
    rpo_minutes_max: 240

    cuenta_aws_compartida: false
    cuenta_aws_compartida_max_apps: 1

    tipo_gestion: "Por torre de TI"
    estrategia_migracion: "Refactoring"
    nivel_riesgo_aceptado: "No críticas, no altas. Cumplimiento SLAs."

    multiregion_required: true
    multiregion_pattern: "Activo-Pasivo (failover sí, no Activo-Activo)"
    yubikey_required: true
    cmk_count: 5

  T2:
    description_es: "Soporta, alimenta o recibe información de procesos tácticos con funciones comerciales requeridas para las operaciones aéreas en curso."
    description_en: "Supports, feeds, or receives information from tactical processes with business functions required for ongoing air operations."

    impact:
      revenue: "bajo"
      service: "bajo"
      operation: "bajo"
    pci_pii: true
    vigencia: "permanente"

    continuity_ha: "Activo-Activo (multizona)"
    redundancia:
      - "Una región"
      - "Multizona"
    disponibilidad: 0.99
    downtime_per_year:
      minutes: 5256.0
      hours: 87.6
      days: 3.65
    incidents_max: 14

    tipo_respaldo: "Plan de backup (AWS Backup)"
    frecuencia_respaldo:
      full: "cada semana"
      incremental: "cada día"
    retencion: "Acorde a necesidades de negocio."

    rto_hours: 6  # hasta 6 horas
    rpo_days: 1   # hasta 1 día

    # KEY · diferencia clave T2 vs T0/T1
    cuenta_aws_compartida: true
    cuenta_aws_compartida_max_apps: 6
    cuenta_aws_compartida_validators_required:
      - "Roberto Carlos Osorio"
      - "José Ángel León"
    cuenta_aws_compartida_excepcion: "sólo se permite por excepción bajo análisis"

    tipo_gestion: "Gestión principal por torre de TI. Apoyo parcial por tercero (parches, respaldos, incidentes)."
    tipo_gestion_retos: "Permisos de admin"
    estrategia_migracion: "Refactoring (replatform · relocate sólo se permite por excepción bajo análisis)"
    nivel_riesgo_aceptado: "No críticas, no altas. Cumplimiento SLAs."

    multiregion_required: false
    multiregion_pattern: null  # Una región multizona
    yubikey_required: true  # Para admin · pero comparte cuenta
    cmk_count_per_account: 5  # 5 por cuenta T2 (compartida entre hasta 6 apps)

  T3:
    description_es: "Soporta, alimenta o recibe información de procesos de apoyo con funciones comerciales requeridas para las operaciones aéreas en curso."
    description_en: "Supports, feeds, or receives information from support processes with business functions required for ongoing air operations."

    impact:
      revenue: "muy_bajo"
      service: "muy_bajo"
      operation: "muy_bajo"
    pci_pii: false  # KEY · esto descalifica a SRG si maneja PII
    vigencia: "decomiso 18 meses"

    continuity_ha: "N/A"
    redundancia:
      - "Una región"
      - "Única zona"
    disponibilidad: 0.95
    downtime_per_year:
      minutes: 26280.0
      hours: 438.0
      days: 18.25
    incidents_max: 18

    tipo_respaldo: "Plan de backup (AWS Backup)"
    frecuencia_respaldo:
      full: "cada semana"
      incremental: "3 por semana"
    retencion: null

    rto_days: 1   # hasta 1 día
    rpo_days: 3   # hasta 3 días

    cuenta_aws_compartida: true
    cuenta_aws_compartida_max_apps: 6

    tipo_gestion: "Gestión centralizada por tercero (full management)."
    estrategia_migracion: "Replatform · Relocate. Decomiso aplicativo dentro de 18 meses."
    nivel_riesgo_aceptado: "No críticas. Cumplimiento SLAs."

    multiregion_required: false
    yubikey_required: true
    cmk_count_per_account: 5

# ---------------------------------------------------------------------------
# Reglas de validación cruzada · usadas por aios tier classify
# ---------------------------------------------------------------------------

validation_rules:

  - id: "TIER_T3_FORBIDS_PII"
    description: "T3 prohíbe PCI/PII por definición · si se detecta PII en código declared como T3, FAIL."
    severity: "HIGH"
    detector_id: "G-NEW-TIER-PII-MISMATCH"
    affected_apps_known:
      - "SRG (#05) · maneja RFCs agencias = PII Sí"

  - id: "TIER_T0_T1_NO_SHARED_ACCOUNT"
    description: "T0 y T1 NO pueden compartir cuenta AWS con otras apps."
    severity: "HIGH"
    detector_id: "G-NEW-TIER-DEDICATED-ACCOUNT"

  - id: "TIER_T2_MAX_6_APPS_PER_ACCOUNT"
    description: "T2 puede compartir cuenta hasta 6 apps · validador: Roberto Carlos Osorio + José Ángel León."
    severity: "MEDIUM"
    detector_id: "G-NEW-TIER-T2-LIMIT"

  - id: "TIER_T0_REQUIRES_MULTIREGION"
    description: "T0 requiere Activo-Activo multiregión · si CDK no tiene Aurora Global o EKS multi-región, FAIL."
    severity: "HIGH"
    detector_id: "G-NEW-TIER-MULTIREGION-MISSING"

  - id: "TIER_T0_T1_REQUIRES_PITR"
    description: "T0 y T1 exigen Continuous backup + PITR · si solo tiene snapshots manuales, FAIL."
    severity: "HIGH"
    detector_id: "G-NEW-TIER-PITR-MISSING"

  - id: "TIER_T0_RTO_15MIN_BIA"
    description: "T0 BIA exige RTO ≤ 10 min y RPO ≤ 60 min · si BIA declarado mayor, FAIL."
    severity: "HIGH"
    detector_id: "G-NEW-TIER-BIA-MISMATCH"

  - id: "TIER_AWS_REGION_PATTERN_T0"
    description: "T0 usa us-east-1 (primary) + us-west-2 (DR) · ADR-002 v2 oficial."
    severity: "MEDIUM"
    detector_id: "G-NEW-TIER-REGION-PATTERN"

  - id: "TIER_T3_DECOMISO_18MONTHS"
    description: "T3 implica decomiso del aplicativo en 18 meses · si vigencia declarada > 18m, mismatch."
    severity: "LOW"
    detector_id: "G-NEW-TIER-DECOMISO-MISMATCH"


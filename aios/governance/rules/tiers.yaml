# ---------------------------------------------------------------------------
# Modelo de cuentas AWS · derivado del TIER assignment
# ---------------------------------------------------------------------------

aws_account_model:

  total_dedicated_accounts: 6
  total_shared_accounts: 1
  environments_per_account: 3  # DES + QA + PROD
  total_aws_accounts: 18  # 6 dedicated × 3 env + 1 shared × 3 env

  dedicated:
    - app: "fleet_ops_app"
      tier: "T0"
      naming: "acme-revacc-fleet_ops_app-{des/qa/prod}"
    - app: "robot"
      tier: "T0"
      naming: "acme-revacc-robot-{des/qa/prod}"
    - app: "bsp"
      tier: "T1"
      naming: "acme-revacc-bsp-{des/qa/prod}"
    - app: "arc"
      tier: "T1"
      naming: "acme-revacc-arc-{des/qa/prod}"
    - app: "cfdis"
      tier: "T1"
      naming: "acme-revacc-cfdis-{des/qa/prod}"

  shared:
    - account_naming: "acme-revacc-t2-{des/qa/prod}"
      tier: "T2"
      apps_consolidated:
        - "srg"
        - "asr"
        - "noshow"
      validation_required:
        - "Roberto Carlos Osorio"
        - "José Ángel León"

  cmk_per_account: 5
  cmk_total_program: 30  # 5 × 6 dedicated accounts (T2 shared cuenta separada)
  cmk_naming_pattern: "acme-kms-{app}-{secrets|aurora|s3-cfdis|logs|ebs}"

  yubikey_total: 1  # 1 por persona admin (Christian) · cubre las 18 cuentas
  yubikey_owner: "Christian Hernández Escamilla"


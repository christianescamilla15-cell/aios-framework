# ---------------------------------------------------------------------------
# Estados del audit trail · state machine
# ---------------------------------------------------------------------------
# Usado por aios governance audit

audit_states:

  - state: "draft"
    description: "Solicitud redactándose · no enviada"
    next_states: ["requested", "cancelled"]

  - state: "requested"
    description: "Solicitud enviada · esperando primera firma"
    next_states: ["in-review", "rejected", "cancelled"]

  - state: "in-review"
    description: "Una o más firmas en proceso · audit trail rastreando"
    next_states: ["partially-approved", "approved", "rejected", "expired"]

  - state: "partially-approved"
    description: "Algunas firmas obtenidas · faltan otras"
    next_states: ["approved", "expired", "rejected"]

  - state: "approved"
    description: "Todas las firmas obtenidas · recurso provisionable"
    next_states: ["provisioned", "expired"]

  - state: "provisioned"
    description: "Recurso entregado/activo · vigencia comenzando"
    next_states: ["renewed", "expired", "revoked"]

  - state: "renewed"
    description: "Vigencia extendida"
    next_states: ["provisioned", "expired", "revoked"]

  - state: "expired"
    description: "Vigencia vencida · acceso revocado automáticamente"
    next_states: ["renewed"]

  - state: "rejected"
    description: "Una firma rechazó · proceso terminado"
    next_states: []  # final state

  - state: "cancelled"
    description: "Solicitante canceló antes de aprobación"
    next_states: []  # final state

  - state: "revoked"
    description: "Acceso revocado anticipadamente · seguridad o cambio de scope"
    next_states: []  # final state


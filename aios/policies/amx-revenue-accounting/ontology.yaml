# ─────────────────────────────────────────────────────────────────
# AMX Revenue Accounting · Domain Ontology v1.0
# ─────────────────────────────────────────────────────────────────
# RFC-003 · Nivel 1 · classifica findings ANTES del auto-fix
# para distinguir entre:
#   - bug                · CWE claro · auto_fix OK
#   - business_rule      · intent del dominio · requiere review humano
#   - migration_candidate · migración conocida · auto_fix con template
#   - unclear            · default · requiere review
#
# Owner: amx-revenue-accounting · Actualizar con cada ADR/PR que
# establezca nuevas reglas de negocio hardcoded como legítimas.
# ─────────────────────────────────────────────────────────────────

version: "1.0"
owner: "amx-revenue-accounting"
updated: "2026-04-22"
description: >
  Catalogo canonico de patterns AMX · deriva del audit hallazgos
  (amx-hallazgos-audit/BASELINE_findings_PRE_REFACTOR.json) + retro
  20-abr + analisis humano experto sobre apps reales (NoShow, SICOFAV,
  etc). Mantener in sync con el equipo de compliance + arquitectura.

# Default cuando ningun pattern matchea
default_classification: "unclear"
default_action: "pause_for_review"  # seguro por default · NO auto_fix

# ─────────────────────────────────────────────────────────────────
# Patterns conocidos
# ─────────────────────────────────────────────────────────────────
patterns:

  # ═══════════════════════════════════════════════════════════════
  # CREDENCIALES · todas son bugs claros · CWE-798
  # ═══════════════════════════════════════════════════════════════
  - id: PERRO_ROBOTICO_CREDENTIAL
    description: "Service account legacy Robot module · literal credential"
    matches:
      - literal: "PERRO_ROBOTICO"
      - literal: "P3rr0R0bot1co"
      - literal: "R0b0t1co_2024_"
    classification: "bug"
    auto_fix_allowed: true
    fix_template: "secrets_manager_migration"
    cwe: "CWE-798"
    evidence: "Audit 2026-04-20 · FRK-025/026 · migración autorizada"
    tags: ["credential", "robot", "critical"]

  - id: S4TP_SICOFAV_CREDENTIAL
    description: "SAT downloader password · CFDIs · inline credential"
    matches:
      - literal: "S4tP@ssw0rd"
    classification: "bug"
    auto_fix_allowed: true
    fix_template: "secrets_manager_migration"
    cwe: "CWE-798"
    tags: ["credential", "sat", "cfdis", "critical"]

  - id: SRG_DB_PASSWORD_CREDENTIAL
    description: "SRG module · DB password inline"
    matches:
      - literal: "SrgDbP@ss2025"
    classification: "bug"
    auto_fix_allowed: true
    fix_template: "secrets_manager_migration"
    cwe: "CWE-798"
    tags: ["credential", "srg", "critical"]

  - id: BSP_SFTP_PASSWORD_CREDENTIAL
    description: "BSP module · SFTP password inline"
    matches:
      - literal: "B5p_M@ster_2025"
    classification: "bug"
    auto_fix_allowed: true
    fix_template: "secrets_manager_migration"
    cwe: "CWE-798"
    tags: ["credential", "bsp", "critical"]

  # ═══════════════════════════════════════════════════════════════
  # LEGACY ACCOUNTS · migración conocida · template específico
  # ═══════════════════════════════════════════════════════════════
  - id: ATOS5246_LEGACY_ACCT
    description: >
      Cuenta legacy ATOS · sistema discontinuado · migración a
      Secrets Manager aprobada en sesión Ciber 20-abr · safe auto_fix.
    matches:
      - literal: "ATOS5246"
    classification: "migration_candidate"
    auto_fix_allowed: true
    fix_template: "secrets_manager_migration_legacy"
    evidence: "Sesión Ciber 20-abr · decisión ADR-042"
    tags: ["legacy", "atos", "migration"]

  # ═══════════════════════════════════════════════════════════════
  # NETWORK · IPs internas hardcoded · migración a Route53 PHZ
  # ═══════════════════════════════════════════════════════════════
  - id: INTERNAL_IP_HARDCODED
    description: "IPs internas AMX · migrar a DNS Route53 Private Hosted Zone"
    matches:
      - literal: "172.18.60.227"
      - literal: "172.24.34.77"
      - literal: "10.19.17.33"
    classification: "migration_candidate"
    auto_fix_allowed: true
    fix_template: "route53_phz_migration"
    evidence: "Coordinar con Diego Zarate · DNS interno canónico"
    tags: ["network", "dns", "route53"]

  # ═══════════════════════════════════════════════════════════════
  # BUSINESS RULES · REQUIEREN REVIEW HUMANO · NO auto_fix
  # ═══════════════════════════════════════════════════════════════
  - id: FLIGHT_829_NOSHOW_RULE
    description: >
      Vuelo 829 en contexto NoShow puede ser BUG (hardcoded) O
      REGLA DE NEGOCIO legítima (ej. acuerdo específico con Sabre
      para ese vuelo). REQUIERE confirmación humana antes de refactor.
    matches:
      # Vuelo 829 en cualquier contexto de Flight/PNR
      - regex: '(?:flight|vuelo|FlightNumber|PNR).*["'']829["'']'
        flags: "i"
      - regex: '["'']829["''].*(?:flight|vuelo|noshow)'
        flags: "i"
    classification: "business_rule"
    auto_fix_allowed: false
    pause_message: >
      Vuelo 829 aparece hardcoded en contexto NoShow. Esto puede
      ser (a) bug de hardcoding · migrar a config/PNR runtime, O
      (b) regla de negocio específica acordada con Sabre/Miguel
      Rachid. CONFIRMAR intent con stakeholder antes de refactor.
    evidence_required:
      - "adr_reference"
      - "stakeholder_sign_off_miguel_rachid"
    tags: ["noshow", "business", "flight", "review-required"]

  # ═══════════════════════════════════════════════════════════════
  # DRIFT · secretos reales en configs de test (RFC-002c placeholder)
  # ═══════════════════════════════════════════════════════════════
  - id: SECRETS_IN_TEST_CONFIG
    description: >
      Credenciales reales encontradas en archivos de test/qa/staging.
      Debe ser mock · no valor real · compromete security + test
      validity.
    matches:
      - regex: '(?:test|qa|staging|fixture).*\.config.*(?:password|secret|apikey)'
        flags: "i"
    classification: "business_rule"
    auto_fix_allowed: false
    pause_message: >
      Secretos reales en config de testing detectados. Confirmar
      con ciber antes de refactor · puede ser simplificación test
      o leak real. Generar mock + rotar credencial si era real.
    evidence_required: ["mock_reference", "credential_rotation_plan"]
    tags: ["test", "drift", "review-required"]

  # ═══════════════════════════════════════════════════════════════
  # CODE SMELLS · TODO/DEAD code de iteraciones previas
  # ═══════════════════════════════════════════════════════════════
  - id: TODO_REMOVE_OLD
    description: >
      Markers TODO-REMOVE / DEPRECATED · pueden ser deuda técnica
      legítima o código olvidado de iteración anterior.
    matches:
      - regex: '(?:TODO|FIXME|XXX|HACK).*(?:remove|delete|deprecated)'
        flags: "i"
      - regex: '@deprecated'
    classification: "unclear"
    auto_fix_allowed: false
    pause_message: >
      Marker de remoción encontrado. Verificar con git blame si es
      deuda reconocida (> 3 meses OK · < 1 mes sospechoso) antes
      de limpiar.
    tags: ["dead-code", "review-required"]

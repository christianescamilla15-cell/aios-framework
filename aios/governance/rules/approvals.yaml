# ---------------------------------------------------------------------------
# Notas operativas
# ---------------------------------------------------------------------------

operational_notes:

  paralelization: |
    Los Steps 1, 3 NO requieren ser secuenciales en algunos chains · se pueden
    pedir en paralelo si la solicitud es estándar (BD-access · YubiKey).
    Step 2 (custodio) sí requiere step 1 firmado típicamente.
    Step 4 (RC + JAL) y Step 5 (Borde) son típicamente bloqueantes paralelos.

  yubikey_sla_warning: |
    YubiKey física es la pieza más larga del camino crítico · 2-4 semanas SLA típico.
    Iniciar trámite ANTES de pedir cuentas AWS (paralelo · no secuencial).

  cyber_pre_walkthrough: |
    Antes de pedir Step 3 (CYBER) en producción · ejecutar `aios cyber pre-walkthrough`
    para tener reportes consolidados Veracode + WIZ + Tenable + Prisma · acelera review.
    (Disponible v3.9.0 · planeado post-v3.8.0)

  rc_dnd_protocol: |
    Roberto Carlos Osorio + José Ángel León · respetar Do-Not-Disturb status.
    NO interrumpir vía Teams si están en DND. Vía Luis Ertuche como intermediario.
    Última observación: 27-abr 03:30 PM · estaba en DND · sesión re-agendada vía Luis.

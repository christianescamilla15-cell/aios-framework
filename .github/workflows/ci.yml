# CI (N02, N03, N09): pruebas por regla en las versiones de Python soportadas, el artefacto que se
# instala (wheel) probado fuera del árbol y la extensión de VS Code compilada.
# Un job «skipped» por depender de otro en rojo NO es verde: en la rama protegida todos son requeridos.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pruebas:
    name: pruebas (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']   # requires-python >= 3.11
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            pyproject.toml
      - run: pip install -e ".[mcp]" -r requirements.txt -r requirements-dev.txt
      # pytest sale con 5 si no encontró pruebas: eso ya falla. La cobertura se reporta, no es la compuerta;
      # la compuerta es una prueba por regla (docs/reglas.md).
      - run: pytest -q --junitxml=reporte.xml --cov --cov-report=xml --cov-report=term
      - run: python3 herramientas/verificar_reportes.py pytest reporte.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: pruebas-${{ matrix.python }}
          path: |
            reporte.xml
            coverage.xml

  # El paquete se distribuye como wheel (no hay imagen Docker): se construye, se instala en un entorno
  # limpio FUERA del árbol y se arranca. Así se detecta lo que el modo editable esconde, como datos
  # (YAML/plantillas) que no entran al wheel.
  paquete:
    name: paquete (wheel instalado y arrancado)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install build==1.6.1 && python -m build --wheel --outdir dist .
      - name: instalar el wheel en un entorno limpio
        run: |
          python -m venv /tmp/aios-venv
          /tmp/aios-venv/bin/pip install dist/*.whl
      - name: arranque y humo desde fuera del árbol (herramientas/humo.sh)
        run: |
          esperado=$(python3 -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          herramientas/humo.sh /tmp/aios-venv/bin/aios "$esperado"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel
          path: dist/*.whl

  extension:
    name: extensión VS Code (compilación)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - run: npm test --if-present
      - run: npm run compile
      - run: test -s out/extension.js
